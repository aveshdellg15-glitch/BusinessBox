<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — BizStacks</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#07111f;--cream:#f8f2e4;--muted:#9aa7b5;--gold:#d9b46f;--gold2:#f2d79e;--line:rgba(255,255,255,.1);--danger:#ff9d9d;--success:#93e6b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 500px at 70% 0,rgba(217,180,111,.12),transparent 60%),var(--bg);color:var(--cream);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.card{width:min(470px,100%);border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:24px;padding:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;margin-bottom:30px}.mark{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#07111f}h1{letter-spacing:-.04em;margin:0 0 8px}.muted{color:var(--muted);font-size:14px}.form{display:grid;gap:12px;margin-top:22px}label{display:grid;gap:7px;font-size:12px;color:#b7c1cd}input{width:100%;border:1px solid var(--line);background:#0b1727;color:white;border-radius:12px;padding:12px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#07111f;cursor:pointer}.btn:disabled{opacity:.55}.message{min-height:22px;color:var(--muted);font-size:13px}.error{color:var(--danger)}.success{color:var(--success)}a{color:var(--gold2)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">B</span>BizStacks</div>
  <h1>Choose a new password</h1>
  <p class="muted">Open this page from the password-reset email sent by BizStacks.</p>
  <div id="configWarning" class="message"></div>
  <div class="form">
    <label>New password<input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label>
    <label>Confirm password<input id="confirm" type="password" minlength="8" autocomplete="new-password"></label>
    <button id="submit" class="btn" onclick="updatePassword()">Update password</button>
    <div id="message" class="message" aria-live="polite"></div>
    <a href="/">Back to BizStacks</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
let recoveryReady=false;
const message=(txt,type="")=>{const el=document.getElementById("message");el.textContent=txt;el.className="message "+type};

if(!window.BIZSTACKS_SUPABASE_CONFIGURED || !window.supabaseClient){
  document.getElementById("configWarning").textContent="Supabase is not configured yet. Add your public Project URL and Publishable Key to supabase-config.js.";
}else{
  window.supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY" || session){
      recoveryReady=true;
    }
  });
  window.supabaseClient.auth.getSession().then(({data})=>{if(data.session) recoveryReady=true});
}

async function updatePassword(){
  if(!window.supabaseClient){message("Supabase is not configured.","error");return}
  const p=document.getElementById("password").value;
  const c=document.getElementById("confirm").value;
  if(p.length<8){message("Use at least 8 characters.","error");return}
  if(p!==c){message("The passwords do not match.","error");return}
  const btn=document.getElementById("submit");btn.disabled=true;btn.textContent="Updating…";
  const {error}=await window.supabaseClient.auth.updateUser({password:p});
  if(error){message(error.message,"error");btn.disabled=false;btn.textContent="Update password";return}
  message("Password updated. Redirecting to your dashboard…","success");
  setTimeout(()=>window.location.href="/dashboard.html",900);
}
</script>
</body>
</html>
